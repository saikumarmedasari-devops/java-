
name: Java CI DevSecOps Pipeline

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

  workflow_dispatch:

permissions:
  contents: read

jobs:

  # JOB 1: BUILD APPLICATION
  build:
    name: Build Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compile Application
        run: mvn -B clean compile

      - name: Package Application
        run: mvn -B package -DskipTests

      # BUILD DOCKER IMAGE
      - name: Build Docker Image
        run: docker build -t java-order-app:latest .

      - name: Verify Docker Image
        run: docker images java-order-app


  # JOB 2: TEST
  test:
    name: Run Test Cases
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Execute JUnit Tests
        run: mvn -B test

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-test-reports
          path: target/surefire-reports/
          if-no-files-found: ignore


  # JOB 3: CODE QUALITY
  quality:
    name: Code Quality Check
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run Checkstyle
        run: mvn -B checkstyle:check


  # JOB 4: SECURITY
  security:
    name: Dependency Security Scan
    runs-on: ubuntu-latest
    needs:  Code Quality

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Scan Dependencies
        run: >
          mvn -B
          org.owasp:dependency-check-maven:12.1.0:check
          -DfailBuildOnCVSS=7

      - name: Upload Security Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: target/dependency-check-report.html
          if-no-files-found: ignore
